name: GoALLC LLVM Payload Release

on:
  push:
    tags:
      - "goallc-llvm23.*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing GoALLC LLVM release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: goallc-llvm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'goallc/llvm-project'
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            build_jobs: 2
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            build_jobs: 4
          - os: darwin
            arch: arm64
            runner: macos-14
            build_jobs: 3
          - os: windows
            arch: amd64
            runner: windows-2025
            build_jobs: 4
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release-tag }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^goallc-llvm23\.1\.0-(v[0-9]+|[0-9]{8}T[0-9]{6}Z)$ ]]
          source_revision="$(git rev-parse HEAD)"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$source_revision"
          echo "source_revision=$source_revision" >>"$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build zstd

      - name: Install Darwin build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache ninja zstd

      - name: Install Windows compiler toolchain
        if: runner.os == 'Windows'
        run: bash llvm/utils/goallc/setup-windows-toolchain.bash

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: goallc-llvm23-ci-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.release.outputs.source_revision }}
          restore-keys: |
            goallc-llvm23-ci-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Reset ccache statistics
        run: if command -v ccache; then ccache --zero-stats; fi

      - name: Build installed LLVM payload
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$RELEASE_TAG-${{ matrix.os }}-${{ matrix.arch }}"
          GOALLC_LLVM_BUILD="$RUNNER_TEMP/goallc-llvm-build" \
          GOALLC_LLVM_INSTALL="$RUNNER_TEMP/$asset_base" \
          GOALLC_BUILD_TYPE=Release \
          GOALLC_LLVM_TARGETS='X86;AArch64' \
          GOALLC_BUILD_JOBS="${{ matrix.build_jobs }}" \
            ./llvm/utils/goallc/build-payload.bash

      - name: Test Windows GoObj support before packaging
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/goallc-llvm-build"
          python3 "$build/bin/llvm-lit" -sv \
            "$build/test/CodeGen/X86/goobj-windows.ll"

      - name: Validate relocatable payload
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$RELEASE_TAG-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/relocated"
          mv "$RUNNER_TEMP/$asset_base" "$RUNNER_TEMP/relocated/$asset_base"
          bash llvm/utils/goallc/validate-payload.bash "$RUNNER_TEMP/relocated/$asset_base" "${{ steps.release.outputs.source_revision }}"

      - name: Package payload
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$RELEASE_TAG-${{ matrix.os }}-${{ matrix.arch }}"
          archive="$asset_base.tar.zst"
          tar -cf - -C "$RUNNER_TEMP/relocated" "$asset_base" | zstd -T0 -o "$archive"
          shasum -a 256 "$archive" >"$archive.sha256"
          shasum -a 256 --check "$archive.sha256"
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          cat "$archive.sha256"
          du -h "$archive"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          release_suffix="${RELEASE_TAG#goallc-llvm23.1.0-}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "GoALLC LLVM 23.1.0 $release_suffix" \
              --notes "Installed, relocatable GoALLC LLVM 23.1.0 payloads from commit $SOURCE_REVISION. This release contains Linux amd64/arm64, Darwin arm64 and Windows amd64 payloads consumed by GoALLC CI."; then
              # Matrix jobs may race to create the release. Accept failure only
              # when the sibling job successfully created the same release.
              gh release view "$RELEASE_TAG" >/dev/null
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256"

      - name: Report ccache
        if: always()
        run: if command -v ccache; then ccache -s; fi

name: GoALLC LLVM CI

on:
  push:
    branches:
      - llvm23.1.master
  pull_request:
    branches:
      - llvm23.1.master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goallc-llvm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    if: github.repository == 'goallc/llvm-project'
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            build_jobs: 2
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            build_jobs: auto
          - os: darwin
            arch: arm64
            runner: macos-14
            build_jobs: 3
          - os: windows
            arch: amd64
            runner: windows-2025
            build_jobs: 4
    defaults:
      run:
        shell: bash
    env:
      LLVM_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      LLVM_ARTIFACT_PREFIX: ${{ github.event_name == 'pull_request' && format('goallc-llvm-pr{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('goallc-llvm-commit-{0}', github.sha) }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Check out LLVM source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.LLVM_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build zstd

      - name: Install Darwin build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache ninja zstd

      - name: Install Windows compiler toolchain
        if: runner.os == 'Windows'
        run: bash llvm/utils/goallc/setup-windows-toolchain.bash

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: goallc-llvm23-ci-${{ matrix.os }}-${{ matrix.arch }}-${{ env.LLVM_SOURCE_REVISION }}
          restore-keys: |
            goallc-llvm23-ci-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Build installed LLVM payload
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$LLVM_ARTIFACT_PREFIX-${{ matrix.os }}-${{ matrix.arch }}"
          build_jobs='${{ matrix.build_jobs }}'
          if [[ "$build_jobs" == auto ]]; then
            build_jobs="$(nproc)"
          fi
          echo "Building LLVM with $build_jobs parallel jobs"
          GOALLC_LLVM_BUILD="$RUNNER_TEMP/goallc-llvm-build" \
          GOALLC_LLVM_INSTALL="$RUNNER_TEMP/$asset_base" \
          GOALLC_BUILD_TYPE=Release \
          GOALLC_LLVM_TARGETS='X86;AArch64' \
          GOALLC_BUILD_JOBS="$build_jobs" \
            ./llvm/utils/goallc/build-payload.bash

      - name: Test core Go and GoObj LLVM support
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/goallc-llvm-build"
          tests=(
            "$build/test/CodeGen/AArch64/fast-isel-statepoint-result.ll"
            "$build/test/CodeGen/AArch64/go-callconv.ll"
            "$build/test/CodeGen/AArch64/go-fast-isel-fallback.ll"
            "$build/test/CodeGen/AArch64/go-fast-isel-frame-address.ll"
            "$build/test/CodeGen/AArch64/go-frame-base.mir"
            "$build/test/CodeGen/AArch64/go-stack-byval.ll"
            "$build/test/CodeGen/AArch64/go-statepoint-stack-args.ll"
            "$build/test/CodeGen/AArch64/goobj-ir-config.ll"
            "$build/test/CodeGen/AArch64/goobj-register-argument-homes.ll"
            "$build/test/CodeGen/Generic/go-abi0-frame.ll"
            "$build/test/CodeGen/Generic/go-argument-homes.ll"
            "$build/test/CodeGen/Generic/go-goret.ll"
            "$build/test/CodeGen/Generic/go-maymorestack.ll"
            "$build/test/CodeGen/Generic/go-softfloat-abi.ll"
            "$build/test/CodeGen/Generic/goobj-data-kinds.ll"
            "$build/test/CodeGen/Generic/goobj-definition-relations.ll"
            "$build/test/CodeGen/Generic/goobj-relations-invalid.ll"
            "$build/test/CodeGen/Generic/goobj-function-boundaries.ll"
            "$build/test/CodeGen/Generic/goobj-pic-globals.ll"
            "$build/test/CodeGen/Generic/goobj-entry-stackmap-cfg.ll"
            "$build/test/CodeGen/Generic/goobj-entry-stackmap-sentinel.ll"
            "$build/test/CodeGen/Generic/goobj-memory-intrinsics.ll"
            "$build/test/CodeGen/Generic/goobj-no-hosted-libcalls.ll"
            "$build/test/CodeGen/Generic/goobj-stack-check-policy.ll"
            "$build/test/CodeGen/X86/branchfolding-inlineasmbr-successor.mir"
            "$build/test/CodeGen/X86/go-callconv.ll"
            "$build/test/CodeGen/X86/go-abi-transition-pic.ll"
            "$build/test/CodeGen/X86/go-stack-byval.ll"
            "$build/test/CodeGen/X86/go-gc-write-barrier.ll"
            "$build/test/CodeGen/X86/go-memset-inline.ll"
            "$build/test/CodeGen/X86/go-statepoint-stack-results.ll"
            "$build/test/CodeGen/X86/goobj-content-addressable-cycle.ll"
            "$build/test/CodeGen/X86/goobj-filetype.ll"
            "$build/test/CodeGen/X86/goobj-import-references.ll"
            "$build/test/CodeGen/X86/goobj-jump-table-boundaries.ll"
            "$build/test/CodeGen/X86/goobj-retpoline.ll"
            "$build/test/CodeGen/X86/retpoline.ll"
            "$build/test/CodeGen/X86/retpoline-external.ll"
            "$build/test/CodeGen/X86/retpoline-regparm.ll"
            "$build/test/CodeGen/X86/goobj-marker-relocations.ll"
            "$build/test/CodeGen/X86/goobj-marker-relocations-invalid.ll"
            "$build/test/CodeGen/X86/goobj-keep-relocation.ll"
            "$build/test/CodeGen/Generic/goobj-anonymous-data.ll"
            "$build/test/CodeGen/X86/goobj-private-table-boundaries.ll"
            "$build/test/CodeGen/X86/goobj-package-symbol-index.ll"
            "$build/test/CodeGen/X86/goobj-package-symbol-index-invalid.ll"
            "$build/test/CodeGen/X86/goobj-static-pic.ll"
            "$build/test/CodeGen/X86/goobj-lexical-scopes.ll"
            "$build/test/CodeGen/X86/goobj-weak-calls.ll"
            "$build/test/CodeGen/X86/goobj-weak-calls-invalid.ll"
            "$build/test/CodeGen/X86/soft-float-memops.ll"
            "$build/test/MC/GoObj"
            "$build/test/Transforms/PreISelIntrinsicLowering/X86/goobj-memory.ll"
          )
          "$build/bin/llvm-lit" -sv "${tests[@]}"

      - name: Validate relocatable payload
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$LLVM_ARTIFACT_PREFIX-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/relocated"
          mv "$RUNNER_TEMP/$asset_base" "$RUNNER_TEMP/relocated/$asset_base"
          bash llvm/utils/goallc/validate-payload.bash "$RUNNER_TEMP/relocated/$asset_base" "$LLVM_SOURCE_REVISION"

      - name: Package payload
        shell: bash
        run: |
          set -euo pipefail
          asset_base="$LLVM_ARTIFACT_PREFIX-${{ matrix.os }}-${{ matrix.arch }}"
          archive="$asset_base.tar.zst"
          artifact_dir="$RUNNER_TEMP/artifact"
          mkdir -p "$artifact_dir"
          tar -cf - -C "$RUNNER_TEMP/relocated" "$asset_base" | zstd -T0 -o "$artifact_dir/$archive"
          (
            cd "$artifact_dir"
            shasum -a 256 "$archive" >"$archive.sha256"
            shasum -a 256 --check "$archive.sha256"
          )
          du -h "$artifact_dir/$archive"

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.LLVM_ARTIFACT_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report ccache
        if: always()
        run: if command -v ccache; then ccache -s; fi
